services:
  postgres:
    image: postgres:16
    container_name: lanchonetes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lanchonetes
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - lanchonetes_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lanchonetes"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lanchonetes_postgres_data:
